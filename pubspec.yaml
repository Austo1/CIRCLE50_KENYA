name: circle50_kenya
description: CIRCLE 50 Kenya community voting platform.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.15.2
  firebase_auth: ^5.6.2
  firebase_storage: ^12.4.10
  cloud_firestore: ^5.6.12
  local_auth: ^2.3.0
  http: ^1.4.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  image_picker: ^1.1.2
  video_player: ^2.10.0
  google_recaptcha_v3: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
